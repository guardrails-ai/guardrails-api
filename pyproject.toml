[project]
name = "guardrails-api"
version = "0.4.4"
description = "Guardrails API"
authors = [
    {name = "Guardrails AI", email = "contact@guardrailsai.com"}
]
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["Guardrails", "Guardrails AI", "Guardrails API", "Guardrails API"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "guardrails-ai>=0.10.0",
    "guardrails-ai-types>=0.4.0",
    "psycopg2-binary>=2.9.0,<3",
    "litellm>=1.39.3,<2.0.0",
    "typer>=0.9.4,<1",
    "requests>=2.31.0",
    "aiocache>=0.11.1",
    "fastapi>=0.110.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
    "openai>=1",
    "typing-extensions>=4.8.0,<5.0.0; python_version < '3.11'",
]

[project.scripts]
guardrails-api = "guardrails_api.cli:cli"

[project.optional-dependencies]
dev = [
    "ruff",
    "coverage",
    "gunicorn>=22.0.0,<23",
    "pre-commit",
    "opentelemetry-distro",
    "jsonref",
    "PyYaml",
    "pyright[nodejs]>=1.1.396"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"guardrails_api" = ["py.typed", "open-api-spec.json"]

[tool.setuptools.packages.find]
include = ["guardrails_api*"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes, matching
# snowglobe-sdk. This must stay explicit: `ruff` is an unpinned dev dependency,
# and with no `select` the project silently inherits whatever ruff's defaults
# are that week. ruff 0.16.0 widened those defaults (adding DTZ, BLE, TRY, S,
# UP, I and more), which turned a green `make lint` into 136 errors with no
# source change. Declaring the rule set makes linting deterministic across
# ruff upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["guardrails_api"]